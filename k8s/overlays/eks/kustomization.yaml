apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

# Pin the real ECR repository and tag here. Argo CD deploys whatever this file says, so a
# release is a git commit that changes newTag. Replace the account id placeholder.
images:
  - name: demo-app
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/demo-app
    newTag: 0.1.0
