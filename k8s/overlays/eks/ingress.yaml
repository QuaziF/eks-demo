# Needs the AWS Load Balancer Controller running in the cluster (terraform/cluster installs it).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # The app has endpoints that burn CPU and memory on demand, so the ALB only accepts your own
    # public IP. This value is a placeholder (a documentation address, reachable by nobody): the
    # Argo CD Application patches in the real IP when scripts/eks-deploy.sh applies it, so the
    # home IP is never committed to this public repo.
    alb.ingress.kubernetes.io/inbound-cidrs: 203.0.113.10/32
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  name: http
