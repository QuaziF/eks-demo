# Untested until the AWS phase. Needs the AWS Load Balancer Controller running in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # The app has endpoints that burn CPU and memory on demand. Restrict the ALB to your own
    # public IP before applying, so the internet cannot use them. Replace the value below.
    alb.ingress.kubernetes.io/inbound-cidrs: 203.0.113.10/32
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  name: http
