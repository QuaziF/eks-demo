apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - namespace.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# The generator appends a content hash to the ConfigMap name and rewrites every reference.
# Changing config.env therefore changes the Deployment's pod template and triggers a
# rolling update by itself (plain ConfigMap edits do not restart pods).
configMapGenerator:
  - name: demo-app-config
    envs:
      - config.env

labels:
  - pairs:
      app.kubernetes.io/part-of: eks-demo
    includeSelectors: false
